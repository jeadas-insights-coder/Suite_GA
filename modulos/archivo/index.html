<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>JeaDas.Insights - Archivo</title>
<style>
:root{
  --brand:#1F3A5F; --brand-ink:#fff; --brand-soft:#E7ECF3; --accent:#C9A227;
  --bg:#F4F6F8; --panel:#fff; --ink:#1B2430; --muted:#5E6B7B; --line:#D9DFE6; --line-strong:#B9C2CD;
  --ok:#1D7A4F; --ok-bg:#E3F3EA; --warn:#9A6200; --warn-bg:#FFF1D6; --bad:#B3261E; --bad-bg:#FBE4E2; --info:#1E5FA8; --info-bg:#E4EFFA;
  --radius:6px; --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.06);
  --serif:'Newsreader',Georgia,'Times New Roman',serif; --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --side:248px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#09090b; --panel:#121214; --ink:#f4f4f5; --muted:#a1a1aa; --line:#2a2a31; --line-strong:#3a3a44; --brand-soft:#18181c;
  --ok-bg:#173326; --warn-bg:#3A2D10; --bad-bg:#3C1B19; --info-bg:#172B42; --shadow:0 1px 2px rgba(0,0,0,.4);
}
:root[data-theme="dark"] .side{background:#0d0d10;color:#e4e4e7}
:root[data-theme="dark"] .side-foot,:root[data-theme="dark"] .side-brand{border-color:#2a2a31}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 var(--sans);background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:1.65rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
a{color:var(--info)} button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:.86rem} .right{text-align:right} .mono{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* barra de progreso */
#load{position:fixed;inset:0 0 auto 0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s;z-index:90}
#load.on{transform:scaleX(.7)}

/* acceso */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--brand) 0 38%,var(--bg) 38%)}
.gate-card{width:min(430px,100%);background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:30px 28px;border-top:5px solid var(--accent)}
.gate-brand{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.gate-brand img{max-height:56px;max-width:90px;object-fit:contain}
.gate-brand b{font-family:var(--serif);font-size:1.25rem;line-height:1.2;display:block}
.gate-brand span{color:var(--muted);font-size:.88rem}
.gate-foot{margin-top:18px;color:var(--muted);font-size:.8rem;text-align:center}

/* estructura */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.side-brand{padding:18px 16px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,.16)}
.side-brand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
.side-brand b{font-family:var(--serif);font-size:1.02rem;line-height:1.2;display:block}
.side-brand small{opacity:.8;font-size:.78rem;display:block;margin-top:2px}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border-radius:var(--radius);display:flex;gap:10px;align-items:center;font-weight:500;color:inherit;opacity:.92}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.2);box-shadow:inset 3px 0 0 var(--accent);opacity:1}
.nav button:focus-visible{outline:3px solid var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;padding:14px 16px;font-size:.78rem;opacity:.85;border-top:1px solid rgba(255,255,255,.16)}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top h1{font-size:1.25rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none}
.content{padding:22px;max-width:1500px;width:100%}
.foot{padding:16px 22px;color:var(--muted);font-size:.8rem;margin-top:auto}

/* controles */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:var(--radius);padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{background:var(--brand-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{border-color:var(--bad);color:var(--bad)} .btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:transparent} .btn.sm{padding:4px 10px;min-height:30px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
svg:not([width]){width:1.1em;height:1.1em;vertical-align:-.15em;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.panel>.hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel>.hd h2,.panel>.hd h3{flex:1}
.panel>.bd{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld .lbl{font-weight:600;font-size:.88rem}
.fld .req{color:var(--bad)}
.fld .hint{color:var(--muted);font-size:.8rem}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--panel);min-height:38px}
textarea{min-height:76px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--bg);color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}
.chk input{width:18px;height:18px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;min-width:0}
legend{font-family:var(--serif);font-weight:600;padding:0 6px;font-size:1.02rem}

/* tablas */
.scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:.82rem;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--panel)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--brand-soft)}
.tbl tr.off td{color:var(--muted);text-decoration:line-through}
.tbl td .sub{display:block;color:var(--muted);font-size:.82rem}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:1.1rem;margin-bottom:4px}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}

/* insignias */
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--brand-soft);color:var(--ink);border:1px solid var(--line)}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent} .badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent} .badge.info{background:var(--info-bg);color:var(--info);border-color:transparent}

/* pestañas */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button:hover{color:var(--ink)} .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:3px solid var(--accent)}

/* inicio */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;border-left:5px solid var(--brand);cursor:pointer;text-align:left}
.tile:hover{background:var(--brand-soft)}
.tile b{display:block;font:600 1.9rem/1.1 var(--serif)} .tile span{color:var(--muted);font-size:.88rem}
.tile.warn{border-left-color:var(--warn)} .tile.bad{border-left-color:var(--bad)}

/* ficha (detalle de documento) */
.ficha{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted);font-size:.86rem;padding-top:1px} .kv dd{margin:0;word-break:break-word}
.sello{display:inline-block;border:2px solid var(--brand);color:var(--brand);border-radius:4px;padding:2px 10px;font:600 .82rem var(--sans);transform:rotate(-2deg)}
.sello.bad{border-color:var(--bad);color:var(--bad)}
.ubic{border:1px dashed var(--line-strong);border-radius:6px;padding:10px 12px;background:var(--brand-soft)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 14px} .tl li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.matrix{border-collapse:collapse;min-width:100%} .matrix th,.matrix td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
.matrix input{width:18px;height:18px}
.logo-prev{width:110px;height:110px;border:1px dashed var(--line-strong);border-radius:8px;display:grid;place-items:center;background:var(--bg)}
.logo-prev img{max-width:100%;max-height:100%}
.swatch{width:38px;height:38px;border-radius:6px;border:1px solid var(--line-strong)}
.qrbox{display:flex;gap:18px;flex-wrap:wrap}
.qrbox figure{margin:0;text-align:center;max-width:210px} .qrbox figcaption{font-size:.82rem;margin-top:6px}
.qrbox .qr{background:#fff;padding:8px;display:inline-block;border-radius:6px}

/* modal y avisos */
.ovl{position:fixed;inset:0;background:rgba(10,16,24,.55);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:28px 14px;overflow:auto}
.modal{background:var(--panel);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(var(--w,720px),100%);display:flex;flex-direction:column;max-height:none}
.modal>.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal>.hd h2{flex:1}
.modal>.bd{padding:18px}
.modal>.ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--bg);border-radius:0 0 10px 10px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:8px;box-shadow:var(--shadow);animation:pop .18s ease-out}
.toast.ok{border-left:5px solid var(--ok)} .toast.err{border-left:5px solid var(--bad);background:#3A1512;color:#fff}
.alert{padding:10px 12px;border-radius:6px;background:var(--info-bg);color:var(--ink);border:1px solid var(--line)}
.alert.err{background:var(--bad-bg)} .alert.warn{background:var(--warn-bg)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block!important;padding:0;color:#000;background:#fff;font:12px/1.4 var(--sans)}
  #print h1,#print h2{font-family:var(--serif)}
  #print table{width:100%;border-collapse:collapse} #print th,#print td{border:1px solid #888;padding:4px 6px;text-align:left;font-size:11px}
  #print .pr-head{display:flex;gap:12px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  #print .pr-head img{max-height:56px;max-width:90px}
  #print .pr-foot{margin-top:14px;font-size:10px;color:#444;border-top:1px solid #888;padding-top:6px}
}
@media (max-width:1100px){.ficha{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);z-index:70;transform:translateX(-102%);transition:transform .2s}
  body.nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .burger{display:inline-flex}
  .content{padding:14px}
  .top{padding:8px 12px}
}
@media (max-width:720px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:0} .kv dt{margin-top:8px}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:6px 4px;background:var(--panel)}
  table.stack td{border:0;padding:4px 10px;display:flex;gap:10px;justify-content:space-between}
  table.stack td::before{content:attr(data-l);color:var(--muted);font-size:.82rem;flex:none;max-width:42%}
  table.stack td>*{text-align:right}
  .modal>.ft .btn{flex:1}
  .ovl{padding:0}.modal{border-radius:0;min-height:100vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script>
/* ============================================================================
   JeaDas.Insights - Archivo (origen: NEXUS ARCHIVE v3) — interfaz.
   Transporte: JDI.api() del puente de la Suite (sin login propio).
   ============================================================================ */
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={boot:null,marca:null,view:'inicio',vs:{},stack:[]};
const lstore={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const can=p=>!!S.boot&&S.boot.permisos.includes(p);
const modOn=m=>!S.boot||S.boot.modulos[m]!==false;
const fmtN=n=>Number(n).toLocaleString('es');
const IC={
  home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  out:'M4 4h16v12H8l-4 4zM8 9h8M8 12h5',
  in:'M20 4H4v12h12l4 4zM8 9h8M8 12h5',

  search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5',
  route:'M5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM19 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM7 17h6a4 4 0 0 0 0-8h-2a3 3 0 0 1 0-6h5',
  chart:'M4 20V10M10 20V4M16 20v-8M22 20H2',
  gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z',
  menu:'M4 6h16M4 12h16M4 18h16', plus:'M12 5v14M5 12h14', x:'M6 6l12 12M18 6L6 18', print:'M7 8V3h10v5M7 17H4v-6h16v6h-3M7 14h10v7H7z',
  dl:'M12 3v12M7 10l5 5 5-5M4 21h16', user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0', moon:'M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z', edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4', back:'M15 5l-7 7 7 7', clip:'M21 11l-9 9a5 5 0 0 1-7-7l9-9a3 3 0 0 1 4 4l-9 9a1 1 0 0 1-2-2l8-8'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]||''}"/></svg>`;

/* ---------- transporte ---------- */
let pending=0;
function loading(d){pending+=d;$('#load').classList.toggle('on',pending>0)}
function call(action,payload){
  payload=Object.assign({},payload||{});
  loading(1);
  return JDI.api({action,payload}).then(r=>{loading(-1);if(r&&r.ok)return r;const e=new Error((r&&r.error)||'Error desconocido');e.code=r&&r.code;throw e},e=>{loading(-1);throw e});
}
/* ---------- avisos y diálogos ---------- */
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'ok');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='err'?7000:3800)}
function modal(o){
  const ov=document.createElement('div');ov.className='ovl';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(o.title)}" style="--w:${o.w||720}px"><div class="hd"><h2>${esc(o.title)}</h2><button class="btn ghost sm" data-x aria-label="Cerrar">${ic('x')}</button></div><div class="bd">${o.body||''}</div><div class="ft"></div></div>`;
  document.body.appendChild(ov);
  const prevFocus=document.activeElement;
  const h={el:ov,bd:$('.bd',ov),close(){ov.remove();S.stack=S.stack.filter(x=>x!==h);prevFocus&&prevFocus.focus&&prevFocus.focus();o.onClose&&o.onClose()},err(m){let a=$('.alert.err',ov);if(!a){a=document.createElement('div');a.className='alert err';a.setAttribute('role','alert');h.bd.prepend(a)}a.textContent=m;a.scrollIntoView({block:'nearest'})},clearErr(){const a=$('.alert.err',ov);a&&a.remove()}};
  $('[data-x]',ov).onclick=h.close;
  ov.addEventListener('mousedown',e=>{if(e.target===ov&&!o.sticky)h.close()});
  ov.addEventListener('keydown',e=>{if(e.key==='Escape')h.close()});
  const ft=$('.ft',ov);
  (o.buttons||[]).forEach(b=>{const x=document.createElement('button');x.type='button';x.className='btn '+(b.cls||'');x.innerHTML=b.t;x.onclick=async()=>{if(b.run){x.disabled=true;try{await b.run(h)}catch(e){h.err(e.message)}finally{x.disabled=false}}else h.close()};ft.appendChild(x)});
  if(!o.buttons||!o.buttons.length)ft.remove();
  S.stack.push(h);
  o.onMount&&o.onMount(h);
  const f=$('input:not([type=hidden]),select,textarea,button.btn.primary',h.bd);f&&f.focus();
  return h;

function opts(list,sel,withEmpty,emptyText){

function F(o){
  const id='f_'+o.n.replace(/\W/g,'_')+(o.uid||'');const v=o.v??'';
  let inp;
  const at=(o.dis?' disabled':'')+(o.ph?` placeholder="${esc(o.ph)}"`:'')+(o.max?` maxlength="${o.max}"`:'')+(o.list?` list="${o.list}"`:'')+(o.min!==undefined?` min="${o.min}"`:'')+(o.autocomplete?` autocomplete="${o.autocomplete}"`:'');
  if(o.t==='textarea')inp=`<textarea id="${id}" name="${esc(o.n)}"${at}>${esc(v)}</textarea>`;
  else if(o.t==='select')inp=`<select id="${id}" name="${esc(o.n)}"${at}>${opts(o.opts,v,!o.req||o.empty,o.emptyText)}</select>`;
  else if(o.t==='check')return `<div class="fld ${o.full?'full':''}"><label class="chk" for="${id}"><input type="checkbox" id="${id}" name="${esc(o.n)}"${v===true||v==='SI'?' checked':''}${o.dis?' disabled':''}> ${esc(o.l)}</label>${o.hint?`<span class="hint">${esc(o.hint)}</span>`:''}</div>`;
  else if(o.t==='multi'){const cur=Array.isArray(v)?v:[];return `<div class="fld ${o.full?'full':''}" data-multi="${esc(o.n)}"><span class="lbl">${esc(o.l)}${o.req?' <span class="req" aria-hidden="true">*</span>':''}</span>${(o.opts||[]).map(x=>`<label class="chk"><input type="checkbox" data-opt="${esc(x)}"${cur.includes(x)?' checked':''}> ${esc(x)}</label>`).join('')}${o.hint?`<span class="hint">${esc(o.hint)}</span>`:''}</div>`}
  else inp=`<input id="${id}" name="${esc(o.n)}" type="${o.t||'text'}" value="${esc(v)}"${at}>`;
  return `<div class="fld ${o.full?'full':''}" data-fld="${esc(o.n)}"><label for="${id}">${esc(o.l)}${o.req?' <span class="req" aria-hidden="true">*</span>':''}</label>${inp}${o.hint?`<span class="hint">${esc(o.hint)}</span>`:''}</div>`;
}
function readForm(root){
  const out={},extra={};
  $$('[name]',root).forEach(el=>{
    if(el.disabled)return;
    const n=el.name;let val=el.type==='checkbox'?el.checked:el.value;
    if(typeof val==='string')val=val.trim();
    if(n.startsWith('x:'))extra[n.slice(2)]=val;else out[n]=val;
  });
  $$('[data-multi]',root).forEach(el=>{const n=el.dataset.multi;const arr=$$('input[data-opt]:checked',el).map(i=>i.dataset.opt);if(n.startsWith('x:'))extra[n.slice(2)]=arr;else out[n]=arr});
  out.extra=extra;return out;
}

     <section class="panel"><div class="hd"><h3>Archivos adjuntos</h3>${can(key+'.editar')&&!anul?`<button class="btn sm" id="att">${ic('clip')} Adjuntar archivo</button><input type="file" id="attf" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" hidden>`:''}</div><div class="bd">${d._adjuntos.length?d._adjuntos.map(a=>`<div class="row between" style="padding:4px 0"><span>${ic('clip')} ${esc(a.nombre)} ${a.tamano?`<span class="muted small">(${Math.round(a.tamano/1024)} KB)</span>`:''}</span><span class="row">${can(key+'.descargar')?`<button class="btn sm" data-dl="${esc(a.id)}">${ic('dl')} Descargar</button>`:''}${can(key+'.editar')&&!anul&&!a.id.startsWith('LEG:')?`<button class="btn sm danger" data-rt="${esc(a.id)}">Retirar</button>`:''}</span></div>`).join(''):'<p class="muted" style="margin:0">Sin archivos digitales. Puede adjuntar PDF, PNG o JPEG (hasta 20 MB).</p>'}</div></section>
     <section class="panel"><div class="hd"><h3>Derivaciones y respuestas</h3>${can(key+'.derivar')&&modOn('derivaciones')&&!anul?`<button class="btn sm" id="drv">${ic('route')} Derivar</button>`:''}</div><div class="bd">${r.derivaciones.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Ruta</th><th>Fechas</th><th>Detalle</th><th>Estado</th><th></th></tr></thead><tbody>${r.derivaciones.map(x=>`<tr><td>${esc(x.Unidad_Origen||'—')} → <b>${esc(x.Unidad_Destino)}</b><span class="sub">${esc(x._responsableNombre||'')}</span></td><td class="small">Derivado ${esc(dstr(x.Fecha_Derivacion))}${x.Fecha_Limite?`<br>Límite ${esc(dstr(x.Fecha_Limite))}`:''}${x.Fecha_Respuesta?`<br>Respuesta ${esc(dstr(x.Fecha_Respuesta))}`:''}</td><td class="small">${esc(x.Motivo)}${x.Instrucciones?`<span class="sub">${esc(x.Instrucciones)}</span>`:''}${x.Respuesta?`<span class="sub">Respuesta: ${esc(x.Respuesta)}</span>`:''}${x.ID_Documento_Respuesta?`<span class="sub">Doc. respuesta: ${esc(x.ID_Documento_Respuesta)}</span>`:''}</td><td>${stateBadge(x.Estado)}${x._vencida?' '+badge('Vencida','bad'):''}</td><td class="row">${x.Estado==='Pendiente'&&can('derivaciones.editar')?`<button class="btn sm" data-dr="rec" data-did="${esc(x.ID_Derivacion)}">Recibir</button>`:''}${['Pendiente','Recibida'].includes(x.Estado)&&can(key+'.responder')?`<button class="btn sm" data-dr="resp" data-did="${esc(x.ID_Derivacion)}">Responder</button>`:''}${!['Cerrada','Anulada'].includes(x.Estado)&&can('derivaciones.cerrar')?`<button class="btn sm" data-dr="cerr" data-did="${esc(x.ID_Derivacion)}">Cerrar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="margin:0">Este documento no ha sido derivado.</p>'}
      ${d._respondeAInfo?`<p class="small" style="margin-bottom:0">Responde a: <a href="#" data-open="${esc(d._respondeAInfo.id)}">${esc(d._respondeAInfo.cite||d._respondeAInfo.id)}</a> — ${esc(d._respondeAInfo.asunto)}</p>`:''}${d._respuestas.length?`<p class="small" style="margin-bottom:0">Respuestas vinculadas: ${d._respuestas.map(x=>`<a href="#" data-open="${esc(x.id)}">${esc(x.cite||x.id)}</a>`).join(', ')}</p>`:''}</div></section>

    </div><aside class="stack">
     <section class="panel"><div class="hd"><h3>Acciones</h3></div><div class="bd stack" style="gap:8px">
      ${!anul&&can(key+'.editar')?`<button class="btn" id="ed">${ic('edit')} Editar datos</button>`:''}
      ${trans.map(t=>`<button class="btn" data-tr="${esc(t.destino)}"${can(key+'.'+t.permiso)?'':' disabled title="Su rol no tiene permiso para esta transición"'}>${esc(t.etiqueta)} → ${esc(t.destino)}</button>`).join('')}

      ${can(key+'.desactivar')?(anul?`<button class="btn" id="rst">Restaurar documento</button>`:`<button class="btn danger" id="anu">Anular documento</button>`):''}</div></section>
     <section class="panel"><div class="hd"><h3>Archivo y ubicación</h3></div><div class="bd stack" style="gap:10px">${d._ubicacionTexto?`<div class="ubic">${esc(d._ubicacionTexto)}</div>`:'<p class="muted" style="margin:0">Aún no está archivado en un tomo.</p>'}
      ${d.Codigo_Tomo&&can('archivo.consultar')?`<button class="btn sm" data-tomo="${esc(d.Codigo_Tomo)}">Ver tomo ${esc(d.Codigo_Tomo)}</button>`:''}
      ${!d.Codigo_Tomo&&!anul&&can('archivo.editar')&&modOn('archivo')?'<button class="btn" id="arc">Archivar en un tomo</button>':''}
      ${d.Codigo_Tomo&&can('archivo.reclasificar')?'<button class="btn" id="rcl">Reclasificar (cambiar de tomo)</button>':''}

     <section class="panel"><div class="bd small muted">Registrado ${esc(tstr(d.Fecha_Registro))} por ${esc(S.boot.usuarios.find(u=>u.id===d.Usuario_Registro)?.nombre||d.Usuario_Registro)}.<br>Última modificación ${esc(tstr(d.Fecha_Modificacion))}.</div></section></aside></div>`;

VIEWS.admin=async(root,params)=>{

const CAT_NOMBRES={INSTITUCION:'Instituciones',UNIDAD:'Unidades',MATERIA:'Materias',GEO:'Geografía',RESPONSABLE:'Responsables',EDIFICIO:'Edificios',SALA:'Salas',ESTANTERIA:'Estanterías',BALDA:'Baldas',CAJA:'Cajas',CARPETA:'Carpetas',MOTIVO_DERIVACION:'Motivos de derivación'};
ADM.catalogos=async el=>{

  <section class="panel"><div class="bd">${head(CAT_NOMBRES[cur]||cur,geo?'Niveles: '+r.niveles.join(' › '):'Los elementos desactivados no se ofrecen en formularios nuevos.',canDo('catalogos','crear')?`<button class="btn primary" id="ni">${ic('plus')} Nuevo elemento</button>`:'')}

  const form=(i,catName)=>{const v=i||{nivel:1};const parents=r.items.filter(x=>x.catalogo==='GEO'&&(!i||x.id!==i.id)).map(x=>({v:x.id,t:path(x)}));
   modal({title:i?'Editar elemento':'Nuevo elemento',w:520,sticky:true,body:`<div class="grid">${F({n:'nombre',l:'Nombre',v:v.nombre,req:true,max:150})}${F({n:'codigo',l:'Código (opcional)',v:v.codigo,max:30})}${F({n:'orden',l:'Orden',t:'number',v:v.orden||0})}${catName==='GEO'?F({n:'nivel',l:'Nivel',t:'select',req:true,v:v.nivel,opts:r.niveles.map((n,k)=>({v:k+1,t:n}))})+F({n:'padre',l:'Elemento superior',t:'select',v:v.padre,opts:parents,emptyText:'— Ninguno (nivel superior) —'}):''}</div>`,
   buttons:[{t:'Cancelar'},{t:'Guardar',cls:'primary',run:async h=>{const x=readForm(h.bd);delete x.extra;x.catalogo=catName;if(i)x.id=i.id;await call('catalogoGuardar',x);toast('Elemento guardado.');await refreshBoot();h.close();go('admin',{tab:'catalogos',cat:catName})}}]})};
  el.onclick=async e=>{const b=e.target.closest('[data-c],[data-e],[data-s],[data-d]');if(!b)return;
    if(b.dataset.c){S.vs.cat=b.dataset.c;return ADM.catalogos(el)}
    if(b.dataset.e)return form(r.items.find(i=>i.id===b.dataset.e),cur);
    try{if(b.dataset.s){const i=r.items.find(x=>x.id===b.dataset.s);await call('catalogoEstado',{id:i.id,estado:i.estado==='Activo'?'Inactivo':'Activo'});toast('Estado actualizado.')}
    else{if(!await confirmBox('Eliminar elemento','Solo se puede eliminar si ningún registro lo usa; si está en uso, desactívelo.','Eliminar',true))return;await call('catalogoEliminar',{id:b.dataset.d});toast('Elemento eliminado.')}

ADM.flujos=async el=>{
  const r=await call('flujosListar'),ed=canDo('flujos','editar');
  el.innerHTML=`<section class="panel"><div class="bd stack">${head('Flujos de trabajo','Estados por los que pasa un documento y quién puede hacer cada cambio. Cada tipo documental usa un flujo.',canDo('flujos','crear')?`<button class="btn primary" id="nf">${ic('plus')} Nuevo flujo</button>`:'')}
  ${r.flujos.map(f=>`<div class="panel" style="box-shadow:none"><div class="bd"><div class="row between"><div><b>${esc(f.flujo)}</b><span class="muted small"> · inicia en «${esc(f.inicial)}» · tipos: ${esc(f.tipos.join(', ')||'ninguno')}</span></div>${ed?`<button class="btn sm" data-e="${esc(f.flujo)}">Editar</button>`:''}</div><p class="small" style="margin:.6rem 0 0">${f.transiciones.map(t=>`${esc(t.origen)} → <b>${esc(t.destino)}</b> <span class="muted">(${esc(t.permiso)})</span>`).join(' · ')}</p></div></div>`).join('')}</div></section>`;
  const form=f=>{const v=f||{flujo:'',inicial:'Registrado',transiciones:[{origen:'Registrado',destino:'Archivado',etiqueta:'Archivar',permiso:'cerrar'}]};let tr=v.transiciones.map(t=>Object.assign({},t));
   const h=modal({title:f?'Editar flujo «'+f.flujo+'»':'Nuevo flujo',w:820,sticky:true,body:'<div id="ff"></div>',buttons:[{t:'Cancelar'},{t:'Guardar flujo',cls:'primary',run:async hh=>{sync();await call('flujoGuardar',{flujo:$('[name=flujo]',hh.bd).value.trim(),inicial:$('[name=inicial]',hh.bd).value.trim(),transiciones:tr});toast('Flujo guardado.');await refreshBoot();hh.close();reAdmin('flujos')}}]});
   const sync=()=>{tr=$$('.trr',h.bd).map(r2=>({origen:$('[name=o]',r2).value.trim(),destino:$('[name=d]',r2).value.trim(),etiqueta:$('[name=l]',r2).value.trim(),permiso:$('[name=p]',r2).value}))};
   const paint=()=>{$('#ff',h.bd).innerHTML=`<div class="grid g2">${F({n:'flujo',l:'Nombre del flujo',v:v.flujo,dis:!!f,req:true,max:40})}${F({n:'inicial',l:'Estado inicial',v:v.inicial,req:true,max:60,hint:'Estado con el que nace cada documento.'})}</div><h4 style="margin:14px 0 6px">Transiciones</h4>${tr.map((t,i)=>`<div class="trr row" style="gap:6px;margin-bottom:6px;flex-wrap:wrap"><input name="o" value="${esc(t.origen)}" placeholder="Desde" aria-label="Estado de origen" style="flex:1;min-width:110px"><span>→</span><input name="d" value="${esc(t.destino)}" placeholder="Hasta" aria-label="Estado de destino" style="flex:1;min-width:110px"><input name="l" value="${esc(t.etiqueta)}" placeholder="Etiqueta del botón" aria-label="Etiqueta" style="flex:1;min-width:110px"><select name="p" aria-label="Permiso requerido">${opts(r.permisos,t.permiso)}</select><button class="btn sm danger" data-rm="${i}" aria-label="Quitar transición">${ic('x')}</button></div>`).join('')}<button class="btn sm" id="at">${ic('plus')} Agregar transición</button><p class="muted small">Un estado sin transiciones de salida es final. Todos los estados deben poder alcanzarse desde el inicial, y no se puede dejar documentos activos en estados que desaparezcan.</p>`;

  const ex=$('#ex');if(ex)ex.onclick=async()=>{try{const r=await call('auditoriaListar',{uso:'exportar',filtros:st.f});download('auditoria.csv','text/csv;charset=utf-8',toCsv(['Fecha','Usuario','Acción','Entidad','Objeto','Detalle','Resultado'],r.filas.map(l=>[l.fecha,l.usuarioNombre||l.usuario,l.accion,l.entidad,l.objetivo,l.detalle,l.resultado])))}catch(er){toast(er.message,'err')}};
  await load();

  if(params&&params.tomo)tomoDetail(params.tomo,load);
};

     <section class="panel"><div class="hd"><h3>Documentos del tomo</h3>${can('archivo.imprimir')?`<button class="btn sm" id="pi">${ic('print')} Imprimir índice</button>`:''}${can('archivo.exportar')?`<button class="btn sm" id="ci">${ic('dl')} CSV</button>`:''}</div>${r.documentos.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Folios</th><th>Número</th><th>Asunto</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>${r.documentos.map(d=>`<tr class="click ${d.Estado_Documento==='Anulado'?'off':''}" data-id="${esc(d.ID_Documento)}"><td>${d.Folio_Inicio?esc(d.Folio_Inicio)+(d.Folio_Fin&&d.Folio_Fin!==d.Folio_Inicio?'–'+esc(d.Folio_Fin):''):'—'}</td><td class="mono">${esc(d.Cite||'S/N')}</td><td>${esc(d.Asunto||d.Descripcion)}</td><td class="small">${d.Precision_Fecha==='Exacta'?esc(dstr(d.Fecha_Documento)):esc(d.Anio_Documento||d.Periodo_Aprox||'s/f')}</td><td>${d.Estado_Documento==='Anulado'?badge('Anulado','bad'):''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="bd muted">El tomo está vacío.</div>'}</section>
     <section class="panel"><div class="hd"><h3>Movimientos e historial</h3></div><div class="bd">${r.movimientos.length?r.movimientos.slice(0,15).map(m=>`<p class="small" style="margin:4px 0">${esc(dstr(m.Fecha))} · <b>${esc(m.Tipo)}</b>: ${esc(m.Desde||'—')} → ${esc(m.Hasta||'—')} ${m.Responsable?'· '+esc(m.Responsable):''} ${m.Estado==='Prestado'?badge('Prestado','warn'):''}</p>`).join(''):'<p class="muted small">Sin movimientos.</p>'}${r.historial.length?`<details><summary class="small">Historial de cambios (${r.historial.length})</summary><ul class="tl">${r.historial.slice(0,30).map(x=>`<li><b>${esc(String(x.accion).replace(/_/g,' ').toLowerCase())}</b> · <span class="muted small">${esc(x.fecha)} · ${esc(x.usuario)}</span><br><span class="small">${esc(x.detalle)}</span></li>`).join('')}</ul></details>`:''}</div></section></div>
     <aside class="stack"><section class="panel"><div class="hd"><h3>Ubicación física</h3></div><div class="bd stack" style="gap:10px"><div class="ubic">${esc(t._ubicacionTexto)||'Sin ubicación registrada'}</div>${can('archivo.mover')?'<button class="btn" id="mv">Cambiar ubicación</button>':''}</div></section>

    const pi=$('#pi',b);if(pi)pi.onclick=async()=>{try{const x=await call('tomoImprimir',{codigo:code});printHtml('Índice del tomo '+x.tomo.Codigo_Tomo,`<p>${esc(x.tomo.Nombre||'')} · ${esc(x.tomo._ubicacionTexto||'Sin ubicación')}</p><table><thead><tr><th>Folios</th><th>Número</th><th>Fecha</th><th>Asunto</th></tr></thead><tbody>${x.documentos.filter(d=>d.Estado_Documento!=='Anulado').map(d=>`<tr><td>${esc(d.Folio_Inicio||'')}${d.Folio_Fin&&d.Folio_Fin!==d.Folio_Inicio?'–'+esc(d.Folio_Fin):''}</td><td>${esc(d.Cite||'S/N')}</td><td>${d.Precision_Fecha==='Exacta'?esc(dstr(d.Fecha_Documento)):esc(d.Anio_Documento||d.Periodo_Aprox||'s/f')}</td><td>${esc(d.Asunto||d.Descripcion)}</td></tr>`).join('')}</tbody></table>`)}catch(e){toast(e.message,'err')}};

  <div class="row"><button class="btn primary" type="submit">${ic('search')} Buscar</button><button class="btn" type="button" id="clr">Limpiar</button><span class="muted small">Orden:</span><select id="srt" aria-label="Ordenar por" style="width:auto">${opts([{v:'registro',t:'Fecha de registro'},{v:'fecha',t:'Fecha del documento'},{v:'cite',t:'Número'},{v:'asunto',t:'Asunto'},{v:'tipo',t:'Tipo'},{v:'gestion',t:'Gestión'}],st.sort)}</select><select id="sdr" aria-label="Sentido" style="width:auto">${opts([{v:'desc',t:'Descendente'},{v:'asc',t:'Ascendente'}],st.dir)}</select>${can('busqueda.exportar')?`<button class="btn" type="button" id="exp">${ic('dl')} Exportar CSV</button>`:''}</div></div></form>
  <section class="panel" id="res"></section></div>`;
  const collect=()=>{const v=readForm($('#sf'));const o={};Object.keys(v).forEach(k=>{if(k==='extra'){const e={};Object.keys(v.extra).forEach(x=>{if(v.extra[x]!==''&&v.extra[x]!==false)e[x]=v.extra[x]});if(Object.keys(e).length)o.extra=e}else if(v[k]!==''&&v[k]!==false)o[k]=v[k]});return o};
  const run=async()=>{const r=await call('buscar',{filtros:st.f,pagina:st.page,orden:st.sort,sentido:st.dir});
    $('#res').innerHTML=r.filas.length?`<div class="hd"><h3>${fmtN(r.total)} resultado${r.total===1?'':'s'}</h3></div>${docTable(r.filas,'bq')}${pager(r.total,r.pagina,r.tamano,'bq')}`:empty('Sin resultados','Pruebe con menos filtros o con otras palabras.');
    bindPager($('#res'),'bq',p=>{st.page=p;run()})};
  $('#sf').onsubmit=e=>{e.preventDefault();st.f=collect();st.sort=$('#srt').value;st.dir=$('#sdr').value;st.page=1;run().catch(er=>toast(er.message,'err'))};
  $('#clr').onclick=()=>{st.f={};st.page=1;VIEWS.busqueda(root)};
  $('#res').onclick=e=>{const r=e.target.closest('tr[data-id]');if(r)docDetail(r.dataset.id,run)};
  const ex=$('#exp');if(ex)ex.onclick=async()=>{try{st.f=collect();const r=await call('buscar',{uso:'exportar',filtros:st.f,orden:st.sort,sentido:st.dir});
    download('busqueda.csv','text/csv;charset=utf-8',toCsv(['ID','Dirección','Tipo','Número','Fecha','Precisión','Asunto','Remitente','Destinatario','Estado','Tomo','Folios','Ubicación'],r.filas.map(d=>[d.ID_Documento,d.Direccion,d._tipoNombre,d.Cite,d.Fecha_Documento,d.Precision_Fecha,d.Asunto,d.Remitente,d.Destinatario,d.Estado_Proceso,d.Codigo_Tomo,d.Folio_Inicio?d.Folio_Inicio+(d.Folio_Fin&&d.Folio_Fin!==d.Folio_Inicio?'-'+d.Folio_Fin:''):'',d._ubicacionTexto])));
    if(r.truncado)toast('Se exportaron solo los primeros registros (límite de exportación).','warn')}catch(er){toast(er.message,'err')}};
  await run();
};

/* ============================ DERIVACIONES ============================ */
VIEWS.derivaciones=async root=>{
  const st=S.dv=S.dv||{page:1,f:{soloAbiertas:true}};
  root.innerHTML=`<div class="stack"><div><h2>Derivaciones y seguimiento</h2><p class="muted small" style="margin:.2rem 0 0">Documentos enviados a otras unidades y su respuesta.</p></div>
  <form class="panel" id="flt"><div class="bd grid g4" style="align-items:end">${F({n:'estado',l:'Estado',t:'select',v:st.f.estado,opts:['Pendiente','Recibida','Respondida','Cerrada','Anulada']})}${F({n:'unidad',l:'Unidad',v:st.f.unidad})}${F({n:'soloAbiertas',l:'Solo abiertas',t:'check',v:st.f.soloAbiertas})}${F({n:'vencidas',l:'Solo vencidas',t:'check',v:st.f.vencidas})}<div class="row"><button class="btn primary" type="submit">Filtrar</button></div></div></form><section class="panel" id="lst"></section></div>`;
  const load=async()=>{const r=await call('derivacionesListar',{filtros:st.f,pagina:st.page});
    $('#lst').innerHTML=r.filas.length?`<div class="scroll"><table class="tbl stack"><thead><tr><th>Documento</th><th>Ruta</th><th>Fechas</th><th>Motivo</th><th>Estado</th><th></th></tr></thead><tbody>${r.filas.map(x=>{const key=x._doc&&x._doc.direccion==='Recibida'?'recibida':'emitida';return `<tr><td data-l="Documento">${x._doc?`<a href="#" data-open="${esc(x._doc.id)}"><b class="mono">${esc(x._doc.cite||x._doc.id)}</b></a><span class="sub">${esc(x._doc.asunto)}</span>`:esc(x.ID_Documento)}</td><td data-l="Ruta">${esc(x.Unidad_Origen||'—')} → <b>${esc(x.Unidad_Destino)}</b><span class="sub">${esc(x._responsableNombre||'')}</span></td><td data-l="Fechas" class="small">Derivado ${esc(dstr(x.Fecha_Derivacion))}${x.Fecha_Limite?`<br>Límite ${esc(dstr(x.Fecha_Limite))}`:''}</td><td data-l="Motivo" class="small">${esc(x.Motivo)}</td><td data-l="Estado">${stateBadge(x.Estado)}${x._vencida?' '+badge('Vencida','bad'):''}</td><td class="row">${x.Estado==='Pendiente'&&can('derivaciones.editar')?`<button class="btn sm" data-a="rec" data-i="${esc(x.ID_Derivacion)}">Recibir</button>`:''}${['Pendiente','Recibida'].includes(x.Estado)&&can(key+'.responder')?`<button class="btn sm" data-a="resp" data-i="${esc(x.ID_Derivacion)}" data-d="${esc(x.ID_Documento)}">Responder</button>`:''}${!['Cerrada','Anulada'].includes(x.Estado)&&can('derivaciones.cerrar')?`<button class="btn sm" data-a="cerr" data-i="${esc(x.ID_Derivacion)}">Cerrar</button>`:''}</td></tr>`}).join('')}</tbody></table></div>${pager(r.total,r.pagina,r.tamano,'dv')}`:empty('Sin derivaciones','No hay derivaciones con esos criterios.');
    bindPager($('#lst'),'dv',p=>{st.page=p;load()})};
  $('#flt').onsubmit=e=>{e.preventDefault();const v=readForm(e.target);st.f={};['estado','unidad'].forEach(k=>{if(v[k])st.f[k]=v[k]});['soloAbiertas','vencidas'].forEach(k=>{if(v[k])st.f[k]=true});st.page=1;load().catch(er=>toast(er.message,'err'))};
  $('#lst').onclick=async e=>{
    const o=e.target.closest('[data-open]');if(o){e.preventDefault();return docDetail(o.dataset.open,load)}
    const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.i;
    try{if(b.dataset.a==='rec'){await call('derivacionRecibir',{id});toast('Derivación recibida.')}
      else if(b.dataset.a==='resp'){await respondForm(id,{ID_Documento:b.dataset.d})}
      else{const ob=await promptBox('Cerrar derivación','Observaciones','Cerrar',false);if(ob===null)return;await call('derivacionCerrar',{id,observaciones:ob});toast('Derivación cerrada.')}
      await load()}catch(er){toast(er.message,'err')}};
  await load();
};

/* ============================ INFORMES ============================ */
VIEWS.informes=async root=>{
  const l=await call('informesListar'),st=S.rp=S.rp||{tipo:l.informes[0].id};
  root.innerHTML=`<div class="stack"><div><h2>Informes</h2><p class="muted small" style="margin:.2rem 0 0">Resúmenes y listados para imprimir o exportar.</p></div>
  <form class="panel" id="rf"><div class="bd grid g4" style="align-items:end">${F({n:'tipo',l:'Informe',t:'select',req:true,v:st.tipo,opts:l.informes.map(x=>({v:x.id,t:x.titulo}))})}${F({n:'desde',l:'Desde',t:'date',v:st.desde})}${F({n:'hasta',l:'Hasta',t:'date',v:st.hasta})}<div class="row"><button class="btn primary" type="submit">Generar</button></div></div></form><section class="panel" id="out"></section></div>`;
  let last=null;
  const run=async()=>{const v=readForm($('#rf'));Object.assign(st,{tipo:v.tipo,desde:v.desde,hasta:v.hasta});
    const r=await call('informe',{tipo:v.tipo,filtros:{desde:v.desde,hasta:v.hasta}});last=r;
    $('#out').innerHTML=`<div class="hd"><h3>${esc(r.titulo)} <span class="muted small">· ${fmtN(r.total)} fila${r.total===1?'':'s'}</span></h3><span class="row">${can('informes.imprimir')?`<button class="btn sm" id="ip">${ic('print')} Imprimir</button>`:''}${can('informes.exportar')?`<button class="btn sm" id="ie">${ic('dl')} CSV</button>`:''}</span></div>${r.filas.length?`<div class="scroll"><table class="tbl"><thead><tr>${r.columnas.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.filas.slice(0,500).map(f=>`<tr>${f.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${r.filas.length>500?`<p class="muted small" style="padding:8px 14px">Se muestran 500 filas; exporte para ver todas.</p>`:''}`:empty('Sin datos','No hay registros para este informe.')}`;
    const ip=$('#ip');if(ip)ip.onclick=async()=>{try{const x=await call('informe',{tipo:last.tipo,filtros:{desde:st.desde,hasta:st.hasta},uso:'imprimir'});printHtml(x.titulo,`<table><thead><tr>${x.columnas.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${x.filas.map(f=>`<tr>${f.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`)}catch(e){toast(e.message,'err')}};
    const ie=$('#ie');if(ie)ie.onclick=async()=>{try{const x=await call('informe',{tipo:last.tipo,filtros:{desde:st.desde,hasta:st.hasta},uso:'exportar'});download('informe_'+x.tipo+'.csv','text/csv;charset=utf-8',toCsv(x.columnas,x.filas))}catch(e){toast(e.message,'err')}}};
  $('#rf').onsubmit=e=>{e.preventDefault();run().catch(er=>toast(er.message,'err'))};
};

/* ============================ QR (ubicación / índice) ============================ */
async function showQr(q){
  try{
    const r=await call('qr',{token:q.token});
    if(r.restringido){toast(r.mensaje,'err');return}
    if(r.modo==='ubicacion'){
      modal({title:'Ubicación del tomo '+r.tomo.Codigo_Tomo,w:560,body:`<div class="ubic" style="font-size:1.1rem">${esc(r.tomo._ubicacionTexto)||'Sin ubicación registrada'}</div><dl class="kv" style="margin-top:12px"><dt>Tomo</dt><dd class="mono">${esc(r.tomo.Codigo_Tomo)}</dd><dt>Nombre</dt><dd>${esc(r.tomo.Nombre)}</dd><dt>Estado</dt><dd>${esc(r.tomo.Estado)}</dd><dt>Documentos</dt><dd>${r.tomo._activos}</dd></dl>`,buttons:[{t:'Ver tomo',cls:'primary',run:h=>{h.close();go('archivo',{tomo:r.tomo.Codigo_Tomo})}},{t:'Cerrar'}]});
    }else{
      modal({title:'Índice del tomo '+r.tomo.Codigo_Tomo,w:820,body:`<p>${esc(r.tomo.Nombre||'')} · ${esc(r.tomo._ubicacionTexto||'')}</p><div class="scroll"><table class="tbl"><thead><tr><th>Folios</th><th>Número</th><th>Asunto</th></tr></thead><tbody>${r.documentos.filter(d=>d.Estado_Documento!=='Anulado').map(d=>`<tr class="click" data-id="${esc(d.ID_Documento)}"><td>${esc(d.Folio_Inicio||'')}${d.Folio_Fin&&d.Folio_Fin!==d.Folio_Inicio?'–'+esc(d.Folio_Fin):''}</td><td class="mono">${esc(d.Cite||'S/N')}</td><td>${esc(d.Asunto||d.Descripcion)}</td></tr>`).join('')}</tbody></table></div>`,buttons:[{t:'Cerrar'}],onMount:h=>{h.bd.onclick=e=>{const t=e.target.closest('tr[data-id]');if(t)docDetail(t.dataset.id)}}});
    }
  }catch(e){toast(e.message,'err')}
}

/* ============================ ARRANQUE ============================ */
(async function init(){
  try{document.documentElement.dataset.theme=lstore.get('jdi.archivo.tema')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}
  try{const q=new URLSearchParams(window.parent.location.search);if(q.get('m')==='archivo'&&/^(indicePublico|ubicacionPublica)$/.test(q.get('qa')||'')&&q.get('qt'))S.qr={token:q.get('qt')}}catch(e){}
  await JDI.ready;
  JDI.onBrand(()=>{refreshBoot().then(()=>{renderShell();go(S.view)}).catch(()=>{})});
  await start();
})();

</script>
